<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeedFlow</title>
  <link rel="stylesheet" href="popup.css">
  <script src="core.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header><span class="brand-mark" aria-hidden="true">»</span><div><h1>SpeedFlow</h1><p>Your video. Your pace.</p></div></header>
  <main>
    <p id="status" role="status" aria-live="polite">Connecting to your video…</p>
    <section aria-label="Playback speed" class="speed-controls">
      <button id="slower" type="button" aria-label="Decrease playback speed">−</button>
      <output id="speed" aria-label="Selected playback speed">1×</output>
      <button id="faster" type="button" aria-label="Increase playback speed">+</button>
    </section>
    <button id="reset" class="reset" type="button">Reset to normal</button>
    <section class="preferences" aria-label="Preferences">
      <label><span>Enable SpeedFlow</span><input id="enabled" type="checkbox" role="switch"></label>
      <label><span>Remember my speed<small>Shared across tabs in this browser</small></span><input id="remember" type="checkbox" role="switch"></label>
      <label><span>Keyboard shortcuts<small>[ slower · ] faster · \ reset</small></span><input id="shortcuts" type="checkbox" role="switch"></label>
    </section>
    <button id="retry" class="retry" type="button" hidden>Reconnect to video</button>
    <p class="footnote">The main controls are on the YouTube player.<br>Preferences stay in your browser.</p>
  </main>
</body>
</html>
